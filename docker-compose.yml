services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clashzone-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Clash_Zone_2026!"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # Czeka aż SQL Server zacznie przyjmować połączenia, zanim wystartuje aplikacja
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clashzone-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # Nadpisuje ConnectionStrings:DefaultConnection z appsettings.json
      ConnectionStrings__DefaultConnection: "Server=db;Database=CLASHZONE;User Id=sa;Password=Clash_Zone_2026!;TrustServerCertificate=true"
    ports:
      - "8080:8080"

volumes:
  mssql-data:
